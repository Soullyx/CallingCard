<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Phantom Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="catalog-page">

    <!-- Шапка сайта (Хедер) -->
    <header class="site-header">
        <div class="logo">PHANTOM STYLE</div>
        <div class="header-menu">
            <!-- Кнопці пошуку додано функцію onclick для виклику prompt-вікна -->
            <button class="search-btn" onclick="searchProducts()" style="cursor: pointer;">SEARCH</button>
            <!-- Добавлен span с id="cart-counter" для отображения количества товаров -->
            <button class="bag-btn">BAG (<span id="cart-counter">0</span>)</button>
        </div>
    </header>

    <!-- Основной контент каталога -->
    <div class="catalog-container">
        
        <!-- Левая панель с фильтрами -->
        <aside class="sidebar-filters">
            <!-- Клик на заголовок FILTERS сбросит фильтр и покажет абсолютно все 16 товаров -->
            <h3 onclick="filterProducts('all')" style="cursor: pointer;">FILTERS</h3>
            <ul class="categories-list">
                <!-- Каждому пункту меню добавлена функция фильтрации по клику -->
                <li onclick="filterProducts('jackets')" style="cursor: pointer;">JACKETS</li>
                <li onclick="filterProducts('t-shirts')" style="cursor: pointer;">T-SHIRTS</li>
                <li onclick="filterProducts('pants')" style="cursor: pointer;">PANTS</li>
                <li onclick="filterProducts('accessories')" style="cursor: pointer;">ACCESSORIES</li>
            </ul>
        </aside>

        <!-- Правая часть: Заголовок и сетка товаров -->
        <main class="catalog-content">
            <h1 class="page-title">CATALOG</h1>

            <section class="products-grid" id="products-container">
                <!-- Товары загрузятся автоматически при открытии страницы через Live Server -->
            </section>
        </main>

    </div>

    <!-- Модальное окно корзины (вставлять перед <script src="app.js"></script>) -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <div class="cart-modal-header">
                <h2>YOUR BAG</h2>
                <span class="close-modal" onclick="toggleCart(false)">&times;</span>
            </div>
            
            <!-- Сюда JS будет динамически добавлять строки с выбранными товарами -->
            <div id="cart-items-container" class="cart-items-list">
                <!-- Если пусто, JS напишет: YOUR BAG IS EMPTY -->
            </div>
            
            <div class="cart-modal-footer">
                <div class="cart-total">
                    <span>TOTAL:</span>
                    <span id="cart-total-price">$0</span>
                </div>
                <button class="checkout-btn" onclick="checkoutOrder()">PROCEED TO CHECKOUT</button>
            </div>
        </div>
    </div>

    <!-- На кнопку BAG вешаем событие открытия корзины -->
    <script>
        document.querySelector('.bag-btn').setAttribute('onclick', 'toggleCart(true)');
        document.querySelector('.bag-btn').style.cursor = 'pointer';
    </script>

    <!-- Подключаем JavaScript-логику (обязательно перед закрывающим тегом body) -->
    <script src="app.js"></script>
</body>
</html>
