<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Phantom Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="catalog-page">

    <!-- Шапка сайта (Хедер) -->
    <header class="site-header">
        <div class="logo">PHANTOM STYLE</div>
        <div class="header-menu">
            <button class="search-btn">SEARCH</button>
            <button class="bag-btn">BAG (0)</button>
        </div>
    </header>

    <!-- Основной контент каталога -->
    <div class="catalog-container">
        
        <!-- Левая панель с фильтрами -->
        <aside class="sidebar-filters">
            <h3>FILTERS</h3>
            <ul class="categories-list">
                <li>JACKETS</li>
                <li>T-SHIRTS</li>
                <li>PANTS</li>
                <li>ACCESSORIES</li>
            </ul>
        </aside>

        <!-- Правая часть: Заголовок и сетка товаров -->
        <main class="catalog-content">
            <h1 class="page-title">CATALOG</h1>

            <!-- Сетка, где будут располагаться карточки одежды -->
            <section class="products-grid">
                
                <!-- Пример одной карточки товара -->
                <article class="product-card">
                    <span class="badge">NEW</span>
                    <!-- Сюда вы позже вставите свою картинку одежды -->
                    <div class="product-img-placeholder"></div> 
                    <h4 class="product-name">REBEL PARKA</h4>
                    <p class="product-price">$185</p>
                    <button class="add-to-bag-btn">ADD TO BAG</button>
                </article>

                <!-- Вы можете скопировать блок <article> еще несколько раз для других товаров -->

            </section>
        </main>

    </div>

</body>
</html>
